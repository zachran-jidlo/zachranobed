name: 'Sets Up Environment'
description: 'Sets up Java, Flutter and correct version code before build'

inputs:
  java:
    description: 'Whether to set up Java. Not needed for tests, lint or web builds.'
    required: false
    default: 'true'
  version-code:
    description: 'Whether to update the version code. Needs the full commit history.'
    required: false
    default: 'true'

runs:
  using: 'composite'

  steps:
    # Sets up Java environment. Gradle dependencies are cached to speed up Android builds.
    - name: Set up JDK 17
      if: inputs.java == 'true'
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # Sets up Flutter environment. The SDK itself is cached, so it is not downloaded on every run.
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.32.4
        cache: true

    # Caches resolved pub packages, keyed by the lockfile.
    - name: Cache pub dependencies
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-

    # Installs Flutter dependencies.
    - name: Install dependencies
      shell: bash
      run: flutter pub get

    # Updates a version code in pubspec.yaml based on count of commits in current branch.
    - name: Update version code
      if: inputs.version-code == 'true'
      shell: bash
      run: ./scripts/update_version_code.sh
