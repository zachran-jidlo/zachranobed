# This workflow is designed to automate the process of building a release IPA for the 'prod' flavor
# of a Flutter application and uploading it to App Store Connect (TestFlight).
name: Build iOS Prod

on:
  # Workflow is triggered manually through the GitHub Actions interface.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # Checkouts the repository with entire commit history, which is needed to calculate the
      # correct build version code in 'Setup environment' step.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Setups Flutter and correct version code before build. Java is not needed for iOS.
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          java: false

      # Prepares keychain and builds signed IPA.
      - name: Build iOS IPA
        uses: ./.github/actions/build-ipa
        with:
          certificate_file_base64: ${{ secrets.IOS_PROD_CERTIFICATE_FILE_BASE64 }}
          certificate_password: ${{ secrets.IOS_PROD_CERTIFICATE_PASSWORD }}
          provisioning_profile_base64: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE_BASE64 }}
          keychain_password: ${{ secrets.IOS_TEMPORARY_KEYCHAIN_PASSWORD }}
          build_flavor: 'prod'
          build_target: 'lib/main_prod.dart'
          build_export_options: 'ios/ExportOptionsProd.plist'

      # Uploads the IPA to App Store Connect with an App Store Connect API key. The build shows up
      # in TestFlight after Apple finishes processing it. Submitting for review stays manual.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          echo -n "$ASC_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"' EXIT
          xcrun altool --upload-app --type ios \
            --file "build/ios/ipa/Zachraň Oběd.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Uploads iOS related artifacts from build to GitHub Actions.
      - name: Upload artifacts
        uses: ./.github/actions/artifacts-ios
