# This workflow runs on pushes and pull requests to the `develop` branch.
# It has three jobs:
# 1. build → Builds the Flutter project
# 2. lint  → Checks formatting and runs static analysis, failing on issues
# 3. test  → Runs the Flutter unit test suite
name: Pull Request Checks

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# Cancel older runs for the same PR if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The APK is only a compile check and never published, so the version code is skipped.
      # Java stays, Gradle needs it.
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          version-code: false

      # Builds a debug APK for the 'dev' flavor.
      - name: Build Android APK
        run: flutter build apk --debug --flavor dev --target lib/main_dev.dart

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Only Flutter is needed here, so Java and the version code are skipped.
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          java: false
          version-code: false

      # Run the Dart analyzer with the project's analysis_options.yaml
      - name: Run Flutter analyze
        run: flutter analyze

      # Fail when anything is not formatted per analysis_options.yaml. Generated
      # files count too, so a model change without a build_runner run is caught.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # Run custom lint with project rules
      - name: Run custom lint
        run: dart run custom_lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Only Flutter is needed here, so Java and the version code are skipped.
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          java: false
          version-code: false

      # Run unit tests
      - name: Run Flutter tests
        run: flutter test
