name: Build Web Dev

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkouts the repository with entire commit history, which is needed to calculate the
      # correct build version code in 'Setup environment' step.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Setups Flutter and correct version code before build. Java is not needed for web.
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          java: false

      - name: Build web
        run: flutter build web --release --no-tree-shake-icons --base-href "/zachranobed-web-dev/" --dart-define=WEB_APP_FLAVOR=dev --target lib/main_dev.dart

      - name: Publish to GitHub Pages
        uses: ./.github/actions/publish-web
        with:
          token: ${{ secrets.WEB_GITHUB_TOKEN }}
          repository: 'zachran-jidlo/zachranobed-web-dev'
