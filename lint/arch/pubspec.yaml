name: lint_arch
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.9.0

# analysis_server_plugin pins an exact analyzer version. Bump both together.
# Analyzer 14 uses the Dart 3.13 constructor syntax, which the IntelliJ Dart plugin marks as errors.
# Stay on analyzer 13 (same as the app) until the IDE handles it.
dependencies:
  analysis_server_plugin: 0.3.18
  analyzer: 13.3.0

dev_dependencies:
  lints: ^6.0.0
