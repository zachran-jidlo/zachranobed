name: Check orders confirmation

on:
  # push:
  #   branches: [main]
  # schedule:
  # - cron: "0,7,15,22,30,37,45,52 9-17 * * 1-5" # CET Timezone - 10:00 - 18:00 (CEST 11:00 - 19:00 - ideally change the setup to 8-16 in summer time) every 7-8 minutes
  workflow_dispatch:

jobs:
  check:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies
        run: npm install     
      - name: Run start
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          MAKE_API_CALLS: ${{ vars.MAKE_API_CALLS }}
          DODO_CLIENT_ID: ${{ secrets.DODO_CLIENT_ID }}
          DODO_CLIENT_SECRET: ${{ secrets.DODO_CLIENT_SECRET }}
          DODO_OAUTH_URI: ${{ secrets.DODO_OAUTH_URI }}
          DODO_SCOPE: ${{ secrets.DODO_SCOPE }}
          DODO_ORDERS_API: ${{ secrets.DODO_ORDERS_API }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
        run: npm run start:check 
        
